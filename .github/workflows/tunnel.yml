name: tunnel
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to fetch'
        required: true
        type: string

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Fetch
        run: |
          curl -sS --max-time 30 -L -o /tmp/response.txt -w "STATUS:%{http_code}" "${{ inputs.url }}"
          echo "" >> /tmp/response.txt
      - name: Save
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date +%s)
          mkdir -p tunnel/
          cp /tmp/response.txt tunnel/${DATE}.txt
          echo "${{ inputs.url }}" > tunnel/${DATE}.url
          git config user.email "tunnel-bot@example.com"
          git config user.name "tunnel-bot"
          git add tunnel/
          git diff --cached --quiet && echo "no new data" || (git commit -m "tunnel ${DATE}" && git push)
